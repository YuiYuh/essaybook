<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fcfbf7">
  <title>EssayBook · 英语作文工作台</title>
  <link rel="stylesheet" href="style.css?v=20261124-study-tools">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="cloud-config.js" defer></script>
  <script src="expressions.js?v=20261124-word-lookup" defer></script>
  <script src="essay-diff.js?v=20261124-study-tools" defer></script>
  <script src="app.js?v=20261124-study-tools" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">EssayBook</div>
      <div class="sideSection" id="study-nav-label">学习</div>
      <nav id="nav" aria-labelledby="study-nav-label"></nav>
      <div class="sideSection" id="tools-nav-label">工具</div>
      <nav id="toolnav" aria-labelledby="tools-nav-label"></nav>
    </aside>
    <div class="mainShell">
      <header class="top">
        <button type="button" class="mobileBrand" data-page="home" aria-label="EssayBook 首页">EssayBook</button>
        <div class="breadcrumbs" id="breadcrumbs">首页</div>
        <div class="topRight">
          <span id="statPill" class="tinyPill"></span>
          <div class="cloudStatus" id="cloudBadge"><span class="dot"></span><span>本地模式</span></div>
          <button type="button" id="openSettings" class="iconButton" aria-label="设置" title="设置">⚙</button>
        </div>
      </header>
      <main id="app"></main>
    </div>
  </div>
  <nav class="mobileBottom" aria-label="主导航"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="dialogHost"></div>
</body>
</html>
